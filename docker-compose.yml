services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      - backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
      - PYTHON_EXEC_BASE=http://backend:8000
